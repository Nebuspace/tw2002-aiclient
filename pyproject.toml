[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tw2002-aiclient"
version = "0.1.0"
description = "Human-piloted TradeWars 2002 trainer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyte>=0.8.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tw2002_aiclient*", "twclient*"]
