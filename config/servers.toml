# servers.toml — public game-server catalog, tracked in git.
#
# A minimal, non-secret directory of known-public TradeWars 2002 servers.
# Contains no credentials of any kind — just connection coordinates a
# profile in your local, gitignored config/profiles.toml may reference.
#
# Greenfield-authored placeholder rows below; extend with real public
# entries as they're curated. Fields:
#   name        - display name for the server.
#   host        - hostname or IP to connect to.
#   port        - telnet port.
#   description - short human-readable note about the server.

[servers.example_one]
name = "Example Server One"
host = "example.host"
port = 2002
description = "Placeholder public catalog entry — replace with a real server."

[servers.example_two]
name = "Example Server Two"
host = "example2.host"
port = 23
description = "Placeholder public catalog entry — replace with a real server."
