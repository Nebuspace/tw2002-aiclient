# servers.toml — public TradeWars 2002 game-server catalog, tracked in git.
#
# Curated snapshot of known-public TWGS servers.  Contains NO credentials —
# only connection coordinates (host / port) that anyone can look up from the
# same public sources listed below.
#
# Sources (scraped 2026-07-25 UTC):
#   microblaster  — microblaster.net Servers.aspx live-listing
#   bbsguide      — telnetbbsguide.com TWGS software category
#
# Dedup rule: (host.lower(), port) is the canonical key.  When both sources
# list the same endpoint the MicroBlaster display-name wins.  BBS Guide
# entries unique to that list are included as-is.
#
# Telnet default port is 23; all other ports are explicit in the source data.
# This file is a curated snapshot — entries go stale; it is NOT a liveness
# probe.  Use it as a starting-point address book, not a guarantee of uptime.
#
# Fields
#   name        — display name
#   host        — hostname or IP
#   port        — telnet port
#   description — short note; includes source tag(s) and status=listed

# ---------------------------------------------------------------------------
# MicroBlaster live-listing  (19 entries — status=listed as of scrape date)
# ---------------------------------------------------------------------------

