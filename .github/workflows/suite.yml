# Offline test suite — runs on every PR and push to main.
#
# Excludes live_login tests (those run on the orchestrator's laptop at merge time
# and are gated by the hub-posted `live-prove` Check Run, NOT this workflow).
#
# Job timeout is an HONEST hang detector, not a padded comfort ceiling.
# Measured GHA suite (post pty_ui exclusion): ~2–3 min wall; with full history
# still well under 5 min on ubuntu-latest. timeout-minutes: 10 = ~3× observed
# healthy runs — long enough for cold pip cache, short enough that a busy-spin
# / wedged xdist worker fails the job instead of burning a runner for 45 min.
# PTY UI drives are excluded via -m "not pty_ui" until WO-TUI-DEAD-TERMINAL-SPIN.
#
# xvfb-run: NOT used here. PTY tests call pty.openpty() (pseudo-terminal),
# not X11 or a display server. The shared pty_curses_supported() probe in
# tests/conftest.py performs a functional capability check on every run and
# automatically marks PTY/curses tests as skipped when the environment cannot
# initialise curses inside a pty subprocess. This is an honest skip (no
# greenwash) — the test declares its own capability gap and GH Actions will
# report them as skipped, not passed. If future tests need an X display, add
# xvfb-run explicitly in that job step and install xvfb in the job.

name: suite

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  suite:
    name: suite
    runs-on: ubuntu-latest
    # 10-minute hang ceiling (≈3× measured healthy GHA runs). See header comment.
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # test_safe_addstr_choke (and kin) `git show <historical-sha>:…` — default
          # shallow clone cannot see those objects (GHA failure: exit 128).
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Minimum version from pyproject.toml requires-python = ">=3.10"
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Run offline suite
        # Exclude live_login (laptop/hub live-prove) AND pty_ui (real curses-in-pty
        # drives). GHA run 30209603462: pty_curses_supported() passed but cockpit
        # *_pty tests stalled in wait_frame (30 failed / 37 errors) — same hazard
        # class as WO-TUI-DEAD-TERMINAL-SPIN. Honest exclusion until that WO lands;
        # not a silent deselect of unrelated failures.
        # Inherits pytest.ini addopts (-q -n auto).
        run: python -m pytest -m "not live_login and not pty_ui"

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: |
            .pytest_cache/
          retention-days: 7
