[pytest]
testpaths = tests
# Parallel runner (WO-TEST-PARALLEL-DEFAULT): parallel is the default (-n auto).
# Serial / single-process debug escape:
#   .venv/bin/python -m pytest -n0
# Live-daemon-gated spectate PTY tests skip themselves unless run/twd.sock exists;
# --deselect them when a live daemon is up (see CLAUDE.md test caveat).
#
# WO-TEST-COLLECT-HYGIENE: default collect must be honest (0 collection ERRORS).
# Banked rehab files still `import twclient` (archive-only) — ignore until a
# lifting HANDOFF rewrites/deletes them. Source of truth for buckets:
#   workorders/WO-TEST-SUITE-REHAB.md
# Greenfield suite (NOT ignored): classify · cli_log · cli_run_dir · connection ·
# ensure_from_play · ensure_no_auto_arm · ensure_protocol · env · guardian ·
# iac · logging_util · player_bank · session · settle · terminal.
# test_login.py is NOT ignored (WO carve-out) — CC P2-023 owns the rewrite; must collect once landed.
# test_guardian.py: reconnect green (P2-027); keepalive collected but skipped until P2-028.
# WO-P2-G2 (menu crawler): test_menu_crawler.py + test_crawl_driver.py un-ignored —
# rehabilitated onto tw2002_aiclient.menu.crawler / .crawl_driver. test_crawl_start_protocol.py
# and test_cli_crawl_wiring.py stay ignored: both exercise the daemon/CLI crawl verb, which G2
# deliberately does not wire (protocol.py and cli.py are owned elsewhere).
# To run an ignored file deliberately: pytest tests/test_<name>.py (still fails
# collect until rewritten) or remove its --ignore line after Accept.
addopts =
    -q
    -n auto
    --ignore=tests/test_aiclient_adapters.py
    --ignore=tests/test_aiclient_play_panels.py
    --ignore=tests/test_analyze.py
    --ignore=tests/test_chains.py
    --ignore=tests/test_clean_preempt.py
    --ignore=tests/test_cli_crawl_wiring.py
    --ignore=tests/test_cli_haggle_wiring.py
    --ignore=tests/test_cli_players.py
    --ignore=tests/test_control_panel.py
    --ignore=tests/test_crawl_start_protocol.py
    --ignore=tests/test_credentials.py
    --ignore=tests/test_explore.py
    --ignore=tests/test_fighter_toll_policy.py
    --ignore=tests/test_formations.py
    --ignore=tests/test_frame_recorder.py
    --ignore=tests/test_game_data.py
    --ignore=tests/test_game_data_persist.py
    --ignore=tests/test_game_knowledge.py
    --ignore=tests/test_game_knowledge_learned_rules.py
    --ignore=tests/test_haggle.py
    --ignore=tests/test_hud_seed.py
    --ignore=tests/test_integration_introspect_persist.py
    --ignore=tests/test_interactive_app.py
    --ignore=tests/test_intervention_labels.py
    --ignore=tests/test_introspector.py
    --ignore=tests/test_ledger.py
    --ignore=tests/test_login_redaction.py
    --ignore=tests/test_miner.py
    --ignore=tests/test_name_bank.py
    --ignore=tests/test_probe.py
    --ignore=tests/test_protocol_haggle.py
    --ignore=tests/test_protocol_trainer_panel.py
    --ignore=tests/test_replay_ledger_integration.py
    --ignore=tests/test_servers.py
    --ignore=tests/test_ship_upgrade_decision.py
    --ignore=tests/test_skills.py
    --ignore=tests/test_spectate_app.py
    --ignore=tests/test_spectate_layout.py
    --ignore=tests/test_state_parser.py
    --ignore=tests/test_trade_adapter.py
    --ignore=tests/test_trade_driver.py
    --ignore=tests/test_world_identity.py
    --ignore=tests/test_world_model.py
    --ignore=tests/test_world_model_integration.py
markers =
    xdist_group: pin tests that share a process-wide resource to one xdist worker
