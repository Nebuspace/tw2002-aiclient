# To run an ignored file deliberately: pytest tests/test_<name>.py (still fails
# collect until rewritten) or remove its --ignore line after Accept.
addopts =
    -q
    -n auto
    --ignore=tests/test_crawl_start_protocol.py
# WO-DEV-PYTEST-TIMEOUT: hung tests → named failures (not infinite suite hang).
# 120s is generous for PTY/daemon/subprocess cases; per-test overrides via
# @pytest.mark.timeout(N) if a case is legitimately slower. method=thread is
# required for pytest-xdist (-n auto); signal does not interrupt worker threads.
timeout = 120
timeout_method = thread

markers =
    xdist_group: pin tests that share a process-wide resource to one xdist worker
    live_login: requires real TWGS login + credentials (orchestrator laptop default; excluded from GHA offline suite)
    pty_ui: real curses-in-pty UI drives; excluded from GHA offline suite until WO-TUI-DEAD-TERMINAL-SPIN (GHA run 30209603462 stalled wait_frame)
