[pytest]
testpaths = tests
# Parallel runner (WO-TEST-PARALLEL): opt-in so default stays serial-safe for
# debugging and until post-foundation full verify. Fast path:
#   .venv/bin/python -m pytest -n auto
# Serial debug:
#   .venv/bin/python -m pytest -n0
# Live-daemon-gated spectate PTY tests skip themselves unless run/twd.sock exists;
# --deselect them when a live daemon is up (see CLAUDE.md test caveat).
#
# WO-TEST-COLLECT-HYGIENE: default collect must be honest (0 collection ERRORS).
# Banked rehab files still `import twclient` (archive-only) — ignore until a
# lifting HANDOFF rewrites/deletes them. Source of truth for buckets:
#   workorders/WO-TEST-SUITE-REHAB.md
# Greenfield suite (NOT ignored): classify · cli_log · cli_run_dir · connection ·
# ensure_from_play · ensure_no_auto_arm · ensure_protocol · env · iac ·
# logging_util · player_bank · session · settle · terminal.
# test_login.py is NOT ignored (WO carve-out) — CC P2-023 owns the rewrite; must collect once landed.
# To run an ignored file deliberately: pytest tests/test_<name>.py (still fails
# collect until rewritten) or remove its --ignore line after Accept.
addopts =
    -q
    --ignore=tests/test_actor_attribution.py
    --ignore=tests/test_aiclient_adapters.py
    --ignore=tests/test_aiclient_play_panels.py
    --ignore=tests/test_analyze.py
